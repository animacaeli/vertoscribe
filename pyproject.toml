[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vertoscribe"
version = "1.1.0"
description = "一条命令，教学视频变高质量技术博客。vertere（转化）+ scribere（书写）= 将视频转化为文字。"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "GuoHao"}]
keywords = ["video", "blog", "whisper", "deepseek", "openai", "ollama", "cli", "transcription", "bilibili", "douyin"]
urls = { repository = "https://github.com/animacaeli/vertoscribe" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Text Processing :: Markup",
]

dependencies = [
    "faster-whisper>=1.0",
    "yt-dlp>=2024.0",
    "openai>=1.0",
    "pillow>=10.0",
    "requests>=2.28",
    "gmssl>=3.2",
]

[project.optional-dependencies]
dev = [
    "tqdm>=4.0",
    "pytest>=8.0",
]

[project.scripts]
vertoscribe = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# _abogus.py 为引入的第三方签名算法（TikTokDownloader, GPL v3），保持原样不改动
"src/_abogus.py" = ["RUF012", "RUF013"]
# test_smoke.py 的导入冒烟测试故意只导入不断言
"tests/*" = ["F401"]
