[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vertoscribe"
version = "0.1.0"
description = "一条命令，教学视频变高质量技术博客。vertere（转化）+ scribere（书写）= 将视频转化为文字。"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "GuoHao"}]
keywords = ["video", "blog", "whisper", "deepseek", "openai", "ollama", "cli", "transcription", "bilibili", "douyin"]
urls = { repository = "https://github.com/animacaeli/vertoscribe" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Text Processing :: Markup",
]

dependencies = [
    "faster-whisper>=1.0",
    "yt-dlp>=2024.0",
    "openai>=1.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "tqdm>=4.0",
    "pytest>=8.0",
]

[project.scripts]
vertoscribe = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
